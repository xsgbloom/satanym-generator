<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satanym - The Crimson Revolt</title>
    <style>
        :root { --blood: #ff0000; --dark-blood: #660000; --ink: #000000; --hint: #888888; --satanic-grey: #666666; }
        body { background: var(--ink); color: var(--blood); font-family: 'Georgia', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .ritual-card { width: 92%; max-width: 380px; padding: 30px; background: #0a0000; border: 2px solid var(--blood); box-shadow: inset 0 0 100px #400, 0 0 40px var(--dark-blood); text-align: center; }
        h2 { font-size: 2.2em; margin: 0; font-variant: small-caps; letter-spacing: 5px; color: var(--blood); text-shadow: 0 0 15px var(--dark-blood); }
        p.quote { font-style: italic; font-size: 0.8em; color: var(--blood); opacity: 0.9; margin: 10px 0 25px; border-top: 1px solid var(--dark-blood); padding-top: 10px; }
        .field-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 5px; color: var(--blood); }
        .editable-tag { color: var(--satanic-grey); font-style: italic; text-transform: none; font-size: 0.9em; margin-left: 5px; }
        .optional-label { color: var(--satanic-grey); font-style: italic; font-size: 0.85em; }
        .optional-wrap { border-color: var(--satanic-grey) !important; opacity: 0.8; }
        .optional-btn { background: var(--satanic-grey) !important; color: #000 !important; cursor: pointer; border: none; padding: 0 15px; font-weight: bold; text-transform: uppercase; font-size: 0.75em; }
        .input-wrap { display: flex; background: #150000; border: 1px solid var(--blood); transition: 0.3s; }
        .input-wrap:focus-within { box-shadow: 0 0 12px var(--blood); border-color: #ff3333; }
        input { width: 100%; background: transparent; color: #ff9999; border: none; padding: 12px; font-family: 'Courier New', monospace; font-size: 15px; }
        input:focus { outline: none; }
        .inner-btn { background: var(--blood); color: #000; border: none; padding: 0 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75em; }
        .affirm-btn { width: 100%; background: var(--blood); color: #000; border: none; padding: 15px; cursor: pointer; font-size: 1.1em; font-variant: small-caps; letter-spacing: 3px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div class="ritual-card">
    <h2>Satanym</h2>
    <p class="quote">"The spirit of liberty, the spirit of rebellion."<br>— Revolt of the Angels</p>
    
    <div class="field-group">
        <label class="optional-label">Optional: Whisper thy secret</label>
        <div class="input-wrap optional-wrap">
            <input type="password" id="secret" placeholder="Enter Private Will">
            <button class="optional-btn" onclick="genHash()">Hash</button>
        </div>
    </div>

    <div class="field-group">
        <label>I. The Signature of Truth <span class="editable-tag">(editable)</span></label>
        <div class="input-wrap">
            <input type="text" id="hash" placeholder="Enter or paste SHA-256 signature">
            <button class="inner-btn" onclick="fetchIdentity()">Summon</button>
        </div>
    </div>

    <div class="field-group">
        <label>II. Manifested Identity <span class="editable-tag">(editable)</span></label>
        <div class="input-wrap">
            <input type="text" id="fullname" placeholder="Name thy rebellion...">
        </div>
    </div>

    <button class="affirm-btn" onclick="registerName()">Affirm Identity</button>
</div>

<script>
    const currentPath = window.location.pathname;

    async function genHash() {
        const val = document.getElementById('secret').value;
        if (!val) return;
        try {
            const res = await fetch(currentPath, {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({secret: val.toLowerCase()})
            });
            const data = await res.json();
            document.getElementById('hash').value = data.hash;
            if (data.registered) document.getElementById('fullname').value = data.full_name;
        } catch (e) { console.error("Ritual Interrupted", e); }
    }

    async function fetchIdentity() {
        const h = document.getElementById('hash').value.trim();
        
        // Regex for exactly 64 hex characters
        const sha256Regex = /^[a-fA-F0-9]{64}$/;
        
        if (!sha256Regex.test(h)) {
            alert("Error: Signature must be a valid SHA-256 hash (64 hex characters).");
            return;
        }

        try {
            const res = await fetch(`${currentPath}?hash=${h}`);
            const data = await res.json();
            document.getElementById('fullname').value = data.full_name || "";
        } catch (e) { console.error("Summoning Failed", e); }
    }

    async function registerName() {
        const h = document.getElementById('hash').value.trim();
        const n = document.getElementById('fullname').value.trim();
        
        if (!h || !n) {
            alert("Your Signature and Identity must be signed in blood to affirm.");
            return;
        }

        const p = n.split(' ');
        const firstName = p[0];
        const lastName = p.slice(1).join(' ');

        try {
            const url = `${currentPath}?register=1&hash=${h}&first_name=${encodeURIComponent(firstName)}&last_name=${encodeURIComponent(lastName)}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.success) {
                alert("This Satanym is eternally thine.");
            } else {
                alert("Error: " + (data.error || "There can be only one!"));
            }
        } catch (e) { alert("Registration error."); }
    }
</script>
</body>
</html>
